name: Tests

on:
  pull_request:
    branches: [main]

# A force-push supersedes the running matrix; cancel it instead of letting
# stale legs occupy runners (3 jobs per push at this repo's PR volume).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One OS failing must not cancel the evidence from the others —
      # a platform-specific failure is exactly what this matrix exists to isolate.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout and make regexes that
      # rely on `.` (no \r) fail in ways the other platforms never see.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # Skip the postinstall (npx playwright install chromium); the tests
      # never launch a browser, so the ~170 MB download is pure CI overhead.
      - run: npm install --ignore-scripts
      - run: node test-all.mjs --quick
      - name: Japan fixture-only gates
        run: |
          node --test \
            tests/providers/japan-job-schema.test.mjs \
            tests/providers/japan-adapter-contract.test.mjs \
            tests/providers/japan-loader-safety.test.mjs \
            tests/providers/tokyodev.test.mjs \
            tests/providers/gaijinpot.test.mjs \
            tests/providers/hellowork.test.mjs
          node --test test/japan-scan-pipeline.test.mjs
          node --test test/japan-evaluation-contract.test.mjs
          node --test test/japan-privacy-boundary.test.mjs
          node --test test/e2e/japan-career-ops.e2e.test.mjs
          node --test test/demo-japan.test.mjs
          node updater-migration-tests.mjs
          node validate-system-paths-coverage.mjs
          node scripts/demo-japan.mjs --fixture-set evals/japan/demo --output-dir output/demo --no-network
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard
